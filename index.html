<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小茵喵 Yinyin Neko 的實況、創作、商店與委託連結。">
  <meta name="theme-color" content="#f3b5c8">
  <title>小茵喵｜Yinyin Neko</title>

  <style>
    :root {
      --pink: #eba6bd;
      --pink-dark: #c97895;
      --pink-light: #ffe8f0;
      --purple-light: #f1ebff;
      --text: #6f5260;
      --white: rgba(255, 255, 255, 0.88);
      --shadow: 0 12px 30px rgba(177, 116, 141, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      color: var(--text);
      font-family:
        "Noto Sans TC", "Microsoft JhengHei",
        system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #ffe1ec 0 8%, transparent 30%),
        radial-gradient(circle at 85% 25%, #eee5ff 0 10%, transparent 32%),
        linear-gradient(150deg, #fffafb, #fff2f7 50%, #f7f2ff);
    }

    .page {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .profile {
      margin-bottom: 28px;
      text-align: center;
    }

   .cat-mark {
  width: 132px;
  height: 132px;
  margin: 18px auto 24px;
  overflow: hidden;
  border: 5px solid white;
  border-radius: 50%;
  background: linear-gradient(145deg, #ffe7ef, #eee7ff);
  box-shadow: var(--shadow);
}

.cat-mark img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

    .label {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--pink-dark);
      background: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      color: #7a5365;
      font-size: clamp(30px, 7vw, 40px);
      letter-spacing: 0.04em;
    }

    .english-name {
      margin: 7px 0 12px;
      color: var(--pink-dark);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .intro {
      margin: 0;
      color: #8c6e7b;
      font-size: 15px;
      line-height: 1.8;
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .link {
      display: grid;
      grid-template-columns: 48px 1fr 24px;
      align-items: center;
      min-height: 72px;
      padding: 11px 17px;
      border: 1px solid rgba(227, 155, 182, 0.32);
      border-radius: 20px;
      color: var(--text);
      background: var(--white);
      box-shadow: var(--shadow);
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        border-color 160ms ease;
    }

    .link:hover {
      border-color: rgba(218, 126, 159, 0.62);
      box-shadow: 0 16px 34px rgba(177, 116, 141, 0.23);
      transform: translateY(-3px);
    }

    .link:focus-visible {
      outline: 3px solid rgba(201, 120, 149, 0.4);
      outline-offset: 3px;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(145deg, var(--pink), #ca83a5);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .link-text strong,
    .link-text span {
      display: block;
    }

    .link-text strong {
      margin-bottom: 3px;
      color: #755463;
      font-size: 16px;
    }

    .link-text span {
      color: #a08390;
      font-size: 12px;
    }

    .arrow {
      color: var(--pink-dark);
      font-size: 20px;
    }

    .shop {
      background:
        linear-gradient(135deg, rgba(255, 237, 244, 0.95), rgba(245, 238, 255, 0.95));
    }

    footer {
      padding: 28px 0 8px;
      color: #aa8d9a;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 32px 16px;
      }

      .link {
        min-height: 68px;
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="profile">
      <div class="cat-mark">
  <img src="yinyin-avatar.png" alt="小茵喵粉色貓耳角色頭像">
</div>
      <div class="label">VTUBER・CREATOR</div>

      <h1>小茵喵</h1>

      <p class="intro">
        實況、插畫與創作紀錄<br>
        歡迎來到小茵喵的連結小屋 ♡
      </p>
    </header>

    <nav class="links" aria-label="小茵喵的主要連結">
      <a class="link" href="https://www.twitch.tv/yinyin_neko"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">TW</span>
        <span class="link-text">
          <strong>Twitch 實況</strong>
          <span>一起聊天、玩遊戲與參加活動</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://www.youtube.com/channel/UC9KsFvW1YYufRUFjG9OoMOA"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">YT</span>
        <span class="link-text">
          <strong>YouTube</strong>
          <span>影片、精華與創作紀錄</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://www.instagram.com/draw_taigachan/"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">IG</span>
        <span class="link-text">
          <strong>Instagram</strong>
          <span>插畫與日常創作分享</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://x.com/yinyin_neko"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">X</span>
        <span class="link-text">
          <strong>X／Twitter</strong>
          <span>最新消息與活動動態</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link shop" href="https://yinmeow.booth.pm/"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">SHOP</span>
        <span class="link-text">
          <strong>BOOTH 商店</strong>
          <span>實況素材與創作商品</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link shop" href="https://truthful-corn-fk29vz.mystrikingly.com/"
         target="_blank" rel="noopener noreferrer">
        <span class="icon">WORK</span>
        <span class="link-text">
          <strong>繪圖委託</strong>
          <span>委託項目、價格與注意事項</span>
        </span>
        <span class="arrow">›</span>
      </a>
    </nav>

    <footer>
      © 2026 Yinyin Neko
    </footer>
  </main>
</body>
</html>
